name: Deploy to DigitalOcean

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          # Required when DROPLET_SSH_KEY was created with a passphrase.
          # Prefer a dedicated deploy key with no passphrase (see README).
          passphrase: ${{ secrets.DROPLET_SSH_KEY_PASSPHRASE }}
          command_timeout: 15m
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi
            if ! command -v npm >/dev/null 2>&1; then
              if [ -s "$HOME/.bashrc" ]; then . "$HOME/.bashrc"; fi
            fi
            if ! command -v npm >/dev/null 2>&1; then
              if [ -s "$HOME/.profile" ]; then . "$HOME/.profile"; fi
            fi
            export PATH="$PATH:/usr/local/bin:$HOME/.local/bin"
            hash -r || true
            command -v node
            command -v npm
            command -v pm2
            # Exit 137 = OOM. Ensure swap exists on small droplets.
            if ! swapon --show | grep -q .; then
              if [ ! -f /swapfile ]; then
                fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
                chmod 600 /swapfile
                mkswap /swapfile
              fi
              swapon /swapfile || true
            fi
            free -h
            cd ~/hatchlog_backend_v1
            git pull origin master
            # Load .env into this SSH shell so `pm2 restart --update-env` does not
            # replace the process env with a secret-less GitHub Actions environment.
            if [ -f .env ]; then
              set -a
              . ./.env
              set +a
            fi
            # --env-file is not allowed in NODE_OPTIONS (Node rejects the process).
            export NODE_OPTIONS="--max-old-space-size=768"
            # Build while the current process keeps serving. Do not stop the API first:
            # set -e would leave the API down if npm ci / prisma / build fails.
            npm ci --no-audit --no-fund
            npx prisma generate
            npm run build
            # Worker at 100% CPU starves Nest bootstrap on a 1-vCPU droplet.
            # Stop it only after the build succeeds, then bring the API up first.
            pm2 stop hatchlog-worker || true
            if command -v redis-cli >/dev/null 2>&1; then
              if ! redis-cli ping >/dev/null 2>&1; then
                echo "WARNING: Redis is not responding on REDIS_URL. Attempting start..."
                (systemctl start redis-server || service redis-server start || true) >/dev/null 2>&1 || true
              fi
              redis-cli ping || echo "WARNING: Redis still down — API will start, worker will back off."
            fi
            pm2 restart hatchlog-api --update-env
            HEALTH_PORT="${PORT:-3001}"
            HEALTH_URL="http://127.0.0.1:${HEALTH_PORT}/health"
            echo "Waiting for ${HEALTH_URL} after pm2 restart..."
            HEALTH_OK=0
            ATTEMPT=0
            while [ "$ATTEMPT" -lt 20 ]; do
              ATTEMPT=$((ATTEMPT + 1))
              if HEALTH_BODY=$(curl -fsS --max-time 3 "$HEALTH_URL"); then
                echo "Health check passed on attempt ${ATTEMPT}: ${HEALTH_BODY}"
                HEALTH_OK=1
                break
              fi
              echo "Health check attempt ${ATTEMPT}/20 failed; retrying in 3s..."
              sleep 3
            done
            if [ "$HEALTH_OK" -ne 1 ]; then
              echo "ERROR: hatchlog-api did not become healthy at ${HEALTH_URL} within ~60s after pm2 restart."
              echo "--- pm2 status ---"
              pm2 status || true
              echo "--- hatchlog-api logs (no secrets) ---"
              pm2 logs hatchlog-api --lines 80 --nostream || true
              echo "--- listening sockets ---"
              (ss -lntp || netstat -lntp || true) 2>/dev/null || true
              pm2 restart hatchlog-worker --update-env || true
              pm2 save || true
              exit 1
            fi
            pm2 restart hatchlog-worker --update-env
            pm2 save
