name: Deploy to DigitalOcean

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_KEY_PASSPHRASE }}
          command_timeout: 25m
          script: |
            set -e
            unset NODE_OPTIONS
            export PATH="$PATH:/usr/local/bin:$HOME/.local/bin"
            hash -r || true

            # Exit 137 = OOM. Keep swap on the 1GB droplet.
            if ! swapon --show | grep -q .; then
              if [ ! -f /swapfile ]; then
                fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
                chmod 600 /swapfile
                mkswap /swapfile
              fi
              swapon /swapfile || true
            fi
            free -h

            if ! command -v docker >/dev/null 2>&1; then
              echo "Installing Docker..."
              curl -fsSL https://get.docker.com | sh
            fi
            systemctl enable --now docker >/dev/null 2>&1 || service docker start || true

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              echo "ERROR: docker compose is not installed."
              exit 1
            fi

            cd ~/hatchlog_backend_v1
            git pull origin master

            if [ ! -f .env ]; then
              echo "ERROR: ~/hatchlog_backend_v1/.env is missing. Compose will not start without it."
              exit 1
            fi

            if command -v redis-cli >/dev/null 2>&1; then
              if ! redis-cli ping >/dev/null 2>&1; then
                echo "Starting host Redis..."
                (systemctl start redis-server || service redis-server start || true) >/dev/null 2>&1 || true
              fi
              redis-cli ping || echo "WARNING: Redis did not respond. Worker jobs will back off."
            fi

            # Build images first so a failed build leaves the current process (pm2 or containers) serving.
            $COMPOSE -f docker-compose.prod.yml build

            # Free :3001 only after images exist.
            if command -v pm2 >/dev/null 2>&1; then
              pm2 delete hatchlog-api hatchlog-worker || true
              pm2 save || true
            fi
            # Host Redis stays; do not start the local compose Redis service.

            $COMPOSE -f docker-compose.prod.yml up -d --no-build --remove-orphans

            HEALTH_URL="http://127.0.0.1:3001/health"
            echo "Waiting for ${HEALTH_URL}..."
            HEALTH_OK=0
            ATTEMPT=0
            while [ "$ATTEMPT" -lt 20 ]; do
              ATTEMPT=$((ATTEMPT + 1))
              if HEALTH_BODY=$(curl -fsS --max-time 3 "$HEALTH_URL"); then
                echo "Health check passed on attempt ${ATTEMPT}: ${HEALTH_BODY}"
                HEALTH_OK=1
                break
              fi
              echo "Health check attempt ${ATTEMPT}/20 failed; retrying in 3s..."
              sleep 3
            done
            if [ "$HEALTH_OK" -ne 1 ]; then
              echo "ERROR: hatchlog-api did not become healthy at ${HEALTH_URL} within ~60s."
              $COMPOSE -f docker-compose.prod.yml ps || true
              echo "--- api logs ---"
              $COMPOSE -f docker-compose.prod.yml logs --tail=80 api || true
              echo "--- worker logs ---"
              $COMPOSE -f docker-compose.prod.yml logs --tail=40 worker || true
              exit 1
            fi
            $COMPOSE -f docker-compose.prod.yml ps
