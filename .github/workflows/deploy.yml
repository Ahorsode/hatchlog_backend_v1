name: Deploy to DigitalOcean

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          # Required when DROPLET_SSH_KEY was created with a passphrase.
          # Prefer a dedicated deploy key with no passphrase (see README).
          passphrase: ${{ secrets.DROPLET_SSH_KEY_PASSPHRASE }}
          command_timeout: 15m
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi
            if ! command -v npm >/dev/null 2>&1; then
              if [ -s "$HOME/.bashrc" ]; then . "$HOME/.bashrc"; fi
            fi
            if ! command -v npm >/dev/null 2>&1; then
              if [ -s "$HOME/.profile" ]; then . "$HOME/.profile"; fi
            fi
            export PATH="$PATH:/usr/local/bin:$HOME/.local/bin"
            hash -r || true
            command -v node
            command -v npm
            command -v pm2
            # Exit 137 = OOM. Ensure swap exists on small droplets.
            if ! swapon --show | grep -q .; then
              if [ ! -f /swapfile ]; then
                fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
                chmod 600 /swapfile
                mkswap /swapfile
              fi
              swapon /swapfile || true
            fi
            free -h
            cd ~/hatchlog_backend_v1
            git pull origin master
            # Build while the current process keeps serving. Do not stop pm2 first:
            # set -e would leave the API down if npm ci / prisma / build fails.
            export NODE_OPTIONS="--max-old-space-size=768"
            npm ci --no-audit --no-fund
            npx prisma generate
            npm run build
            pm2 restart hatchlog-api hatchlog-worker --update-env
            pm2 save
            HEALTH_PORT="${PORT:-3001}"
            HEALTH_URL="http://localhost:${HEALTH_PORT}/health"
            echo "Waiting for ${HEALTH_URL} after pm2 restart..."
            HEALTH_OK=0
            ATTEMPT=0
            while [ "$ATTEMPT" -lt 10 ]; do
              ATTEMPT=$((ATTEMPT + 1))
              if HEALTH_BODY=$(curl -fsS --max-time 3 "$HEALTH_URL"); then
                echo "Health check passed on attempt ${ATTEMPT}: ${HEALTH_BODY}"
                HEALTH_OK=1
                break
              fi
              echo "Health check attempt ${ATTEMPT}/10 failed; retrying in 3s..."
              sleep 3
            done
            if [ "$HEALTH_OK" -ne 1 ]; then
              echo "ERROR: hatchlog-api did not become healthy at ${HEALTH_URL} within ~30s after pm2 restart. The deploy is treated as failed."
              exit 1
            fi
