name: Deploy to DigitalOcean

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          # Required when DROPLET_SSH_KEY was created with a passphrase.
          # Prefer a dedicated deploy key with no passphrase (see README).
          passphrase: ${{ secrets.DROPLET_SSH_KEY_PASSPHRASE }}
          command_timeout: 15m
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi
            if ! command -v npm >/dev/null 2>&1; then
              if [ -s "$HOME/.bashrc" ]; then . "$HOME/.bashrc"; fi
            fi
            if ! command -v npm >/dev/null 2>&1; then
              if [ -s "$HOME/.profile" ]; then . "$HOME/.profile"; fi
            fi
            export PATH="$PATH:/usr/local/bin:$HOME/.local/bin"
            hash -r || true
            command -v node
            command -v npm
            command -v pm2
            # Exit 137 = OOM. Ensure swap exists on small droplets.
            if ! swapon --show | grep -q .; then
              if [ ! -f /swapfile ]; then
                fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
                chmod 600 /swapfile
                mkswap /swapfile
              fi
              swapon /swapfile || true
            fi
            free -h
            cd ~/hatchlog_backend_v1
            git pull origin master
            # Free RAM while installing/building (brief downtime).
            pm2 stop hatchlog-api hatchlog-worker || true
            export NODE_OPTIONS="--max-old-space-size=768"
            npm ci --no-audit --no-fund
            npx prisma generate
            npm run build
            pm2 restart hatchlog-api hatchlog-worker --update-env
            pm2 save
